; Dedicated PHP-FPM pool for NAA, isolated from the Wascana FC site (own user, own socket, own sessions).
[naa]
user = naa
group = naa
listen = /run/php/naa-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s

; PHP mail() sends through Google Workspace SMTP relay via msmtp (installed for NAA only; the system sendmail is untouched).
php_admin_value[sendmail_path] = /usr/bin/msmtp -t -C /var/www/naa/private/msmtprc
php_admin_value[session.save_path] = /var/www/naa/sessions
php_admin_value[error_log] = /var/www/naa/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Regina time (CST, no daylight saving) for NAA only. Scoped to this pool so Wascana and the system clock are untouched.
; env[TZ] also reaches msmtp, so its log lines are in Regina time too.
php_admin_value[date.timezone] = America/Regina
env[TZ] = America/Regina
