# NAA (naacanada.org) nginx site. Separate from the Wascana FC site; do not edit wascanafc.conf.
# Installed to /etc/nginx/sites-available/naa.conf (symlinked into sites-enabled).
# Translated from the cPanel public/.htaccess. Cloudflare terminates visitor TLS; with SSL mode Full it
# connects to this origin over HTTPS (self-signed cert below) and sends X-Forwarded-Proto.

# NAA is matched by server_name only (never a default_server): the Wascana site owns the default
# server on ports 80 and 443, so unmatched hostnames keep going to Wascana exactly as before.
server {
    listen 80;
    listen [::]:80;
    # Cloudflare "Full" mode connects here over HTTPS. The certificate is self-signed (accepted by Full);
    # swap in a Cloudflare Origin Certificate to move to Full (Strict).
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/ssl/naa/naa.crt;
    ssl_certificate_key /etc/ssl/naa/naa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name naacanada.org www.naacanada.org nationalathletics.ca www.nationalathletics.ca;

    root /var/www/naa/site;
    index index.html;

    # Redirects must not embed the origin's http scheme/port (Cloudflare sits in front).
    absolute_redirect off;

    # Old domain and www go to the canonical host.
    if ($host ~* ^(www\.)?nationalathletics\.ca$) { return 301 https://naacanada.org$request_uri; }
    if ($host = www.naacanada.org)                { return 301 https://naacanada.org$request_uri; }
    # Enforce HTTPS when the proxy says the visitor used HTTP (direct IP testing has no header, so it is left alone).
    if ($http_x_forwarded_proto = http)           { return 301 https://$host$request_uri; }

    access_log /var/www/naa/logs/access.log;
    error_log  /var/www/naa/logs/error.log;

    include snippets/naa-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json text/xml image/svg+xml;

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Clean URLs: /about -> /about/ (directory index), static files served as is.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include snippets/naa-security-headers.conf;
    }

    # Long-lived static assets.
    location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/naa-security-headers.conf;
        try_files $uri =404;
    }

    # Include-only PHP helpers and private config are never served.
    location ~ ^/(mail-common|recaptcha-verify|naa_config)\.php$ { return 404; }
    location ^~ /private/ { return 404; }
    location ~ ^/court-booking/.*\.json$ { return 403; }
    location ~ /\.(?!well-known) { return 404; }

    # Form handlers (contact, registration, enquiries, notify, coach apply) run in the dedicated NAA PHP-FPM pool.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/naa-fpm.sock;
        include snippets/naa-security-headers.conf;
    }
}
