backend:
  name: github
  repo: kiran987/national
  branch: master

# Local backend: run `npx decap-server` alongside `npm run dev` to edit
# content on disk with no GitHub OAuth required. Remove this line (and set
# up a GitHub OAuth App + provider) once the CMS needs to run against the
# deployed site.
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "programs"
    label: "Programs"
    folder: "src/content/programs"
    create: true
    slug: "{{fields.id}}"
    identifier_field: "id"
    fields:
      - { label: "ID (matches filename, lowercase-hyphenated)", name: "id", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Nav Title", name: "navTitle", widget: "string" }
      - { label: "Short Name", name: "shortName", widget: "string" }
      - { label: "Badge", name: "badge", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Emoji", name: "emoji", widget: "string" }
      - { label: "Icon", name: "icon", widget: "string" }
      - { label: "Color (hex)", name: "color", widget: "string" }
      - { label: "Accent Color (hex)", name: "accentColor", widget: "string" }
      - { label: "Background Color (css)", name: "bgColor", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Ages", name: "ages", widget: "string" }
      - { label: "Coach Ratio", name: "ratio", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Season Duration", name: "seasonDuration", widget: "string" }
      - { label: "Sessions Per Week", name: "sessionsPerWeek", widget: "string" }
      - { label: "Block Weeks", name: "blockWeeks", widget: "number", value_type: "int" }
      - { label: "Block Price ($)", name: "blockPrice", widget: "number" }
      - { label: "Hourly Rate ($)", name: "hourlyRate", widget: "number" }
      - { label: "Payment Plan Available", name: "paymentPlan", widget: "boolean", default: true }
      - label: "Partner Info"
        name: "partnerInfo"
        widget: "object"
        required: false
        fields:
          - { label: "Partner Name", name: "name", widget: "string" }
          - { label: "Partner Description", name: "description", widget: "text" }
          - { label: "Partner Logo", name: "logo", widget: "image", required: false }
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        field: { label: "Highlight", name: "item", widget: "string" }
      - label: "Skills Focus"
        name: "skillsFocus"
        widget: "list"
        field: { label: "Skill", name: "item", widget: "string" }
      - label: "Tiers"
        name: "tiers"
        widget: "list"
        fields:
          - { label: "Tier Name", name: "name", widget: "string" }
          - { label: "Badge", name: "badge", widget: "string", required: false }
          - { label: "Ages", name: "ages", widget: "string" }
          - { label: "Format", name: "format", widget: "string" }
          - { label: "Focus", name: "focus", widget: "text" }
          - { label: "Coach Ratio", name: "ratio", widget: "string" }
          - label: "Curriculum"
            name: "curriculum"
            widget: "list"
            field: { label: "Curriculum Item", name: "item", widget: "string" }
      - label: "What's Included"
        name: "whatsIncluded"
        widget: "list"
        field: { label: "Item", name: "item", widget: "string" }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "schedules"
    label: "Schedules"
    folder: "src/content/schedules"
    create: true
    extension: "json"
    format: "json"
    slug: "{{program}}-{{tier}}-{{season}}"
    fields:
      - { label: "Program", name: "program", widget: "string" }
      - { label: "Tier", name: "tier", widget: "string" }
      - { label: "Season", name: "season", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Registering Now", "Upcoming", "Full", "Completed"]
      - { label: "Start Date", name: "startDate", widget: "string", hint: "e.g. 2026-09-14" }
      - { label: "End Date", name: "endDate", widget: "string", hint: "e.g. 2026-11-16" }
      - { label: "Day of Week", name: "dayOfWeek", widget: "string" }
      - { label: "Time", name: "time", widget: "string", hint: "e.g. 6:00–7:00 PM" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Total Spots", name: "spotsTotal", widget: "number", value_type: "int" }
      - { label: "Spots Remaining", name: "spotsRemaining", widget: "number", value_type: "int" }
      - { label: "Price ($)", name: "price", widget: "number" }
      - { label: "TeamLinkt Registration URL", name: "teamLinktUrl", widget: "string" }
      - { label: "Waitlist URL", name: "waitlistUrl", widget: "string", required: false }
      - { label: "Notes", name: "notes", widget: "text", required: false }

  - name: "camp-sessions"
    label: "Camp Sessions"
    folder: "src/content/camp-sessions"
    create: true
    extension: "json"
    format: "json"
    slug: "{{name}}-{{season}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Camp Type"
        name: "campType"
        widget: "select"
        options: ["Day Camp", "Evening Clinic", "School Break Camp", "PD Day Camp"]
      - { label: "Sport", name: "sport", widget: "string" }
      - { label: "Age Group", name: "ageGroup", widget: "string" }
      - { label: "Season", name: "season", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Registering Now", "Upcoming", "Full", "Completed"]
      - { label: "Start Date", name: "startDate", widget: "string", hint: "e.g. 2026-07-06" }
      - { label: "End Date", name: "endDate", widget: "string", hint: "e.g. 2026-07-10" }
      - { label: "Time", name: "time", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Total Spots", name: "spotsTotal", widget: "number", value_type: "int" }
      - { label: "Spots Remaining", name: "spotsRemaining", widget: "number", value_type: "int" }
      - { label: "Price ($)", name: "price", widget: "number" }
      - { label: "TeamLinkt Registration URL", name: "teamLinktUrl", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Notes", name: "notes", widget: "text", required: false }
